; tmntnet — сетевой кооп для TMNT (Konami, 2003, PC)
; Один и тот же файл используется модом (tmnt.exe на хосте) и клиентом.
; recommended-settings=1 (установщик ставит рекомендованные настройки один раз; дальше они ваши)

[net]
role=host            ; host = ПК, на котором запущена игра; client = ПК второго игрока
peer=                ; client: IP хоста (пусто = автопоиск в LAN)
                     ; host: если задан, P2 принимается только с этого IP
port=7777            ; UDP, ENet
discovery_port=7778  ; UDP, поиск хоста в LAN
input_delay=2        ; кадры; для будущего lockstep (v2), в v1 не используется
timeout_ms=1000      ; нет ввода дольше этого = P2 отпускает кнопки и стоит;
                     ; соединение LAN/IP закрывается через max(5 c, 5*timeout_ms)
name=                ; имя, которое видит другая сторона и которое стоит над вашей черепахой
                     ; (пусто = имя в Steam, без Steam = имя компьютера)
; Игра через интернет — через Steam (нужен запущенный клиент Steam на обоих ПК).
transport=auto       ; auto = LAN/IP и Steam одновременно; steam = только Steam
                     ; (если Steam не запустился — LAN/IP); enet = только LAN/IP, Steam не трогать
lobby_type=friends   ; хост: лобби Steam видно friends = только друзьям; public = всем
host_steamid=        ; клиент: SteamID64 хоста или ссылка на профиль (подключиться напрямую)
allow_steamid=       ; хост: SteamID64 через запятую, кого пускать без лобби

[log]
log_level=info       ; error | warn | info | debug

[mod]
; Как мод нажимает кнопки P2: выставляет клавиши P2 в состоянии клавиатуры
; DirectInput. auto = брать текущие бинды P2 из памяти игры (меняются в
; меню настроек игры); ini = всегда использовать p2_keys ниже.
p2_binds=auto
; DIK-коды по слотам игры: dash, juggle, special, shuriken_change, shuriken,
; jump, attack, strong, pause, -, -, start, up, right, down, left
p2_keys=0x4E,0x4D,0x49,0x48,0x47,0x52,0x4B,0x4C,0x01,-1,-1,0x9C,0xC7,0xD1,0xCF,0xD3
; Сетевая игра: пока второй игрок подключён по сети, клавиши P2 и геймпад P2
; на ПК хоста ничего не делают (чтобы случайно не управлять чужим героем).
p2_lock=1
; Автосохранение: после каждого пройденного уровня мод записывает savegame.dat
; (без экрана и вопроса) и держит включённой АВТОЗАПИСЬ игры (ПАРАМЕТРЫ ->
; ПРОЧИЕ ПАРАМЕТРЫ), чтобы и в конце главы игра не спрашивала. 0 = как в игре.
autosave=1
; Сколько играют сюжет: 2, 3 или 4 (игроки 3 и 4 берут черепах, которых никто
; не выбрал). В игре это выбирается в РЕЖИМ СЮЖЕТА: 1 ИГРОК, 2 ИГРОКА,
; ТРИ ИГРОКА, ЧЕТЫРЕ ИГРОКА — выбор в меню главнее этой строки.
players=2
; Команда (2-4 игрока): упавшая черепаха не погибает, а лежит оглушённая
; (звёздочки), враги её не трогают. Встань рядом и держи кнопку revive_button
; 4 секунды (атаковать в это время нельзя, удар по тебе начинает подъём заново)
; — она встанет с пятой частью жизни. Сердечек сверху нет: уровень
; проигран, только когда упадут все. Кнопка — строка таблицы клавиш: dash,
; juggle, special, shuriken_change (смена сюрикена, у игрока 1 это Left Shift),
; shuriken, jump, attack, strong. revive=0 — как в игре (сердечки, гибель).
revive=1
revive_button=shuriken_change
; Клавиши игроков 3 и 4 за этой клавиатурой: коды DIK по строкам таблицы клавиш
; игры (рывок, жонглирование, спецприём, смена сюрикена, сюрикен, прыжок, атака,
; сильная атака, пауза, -, -, старт, вверх, вправо, вниз, влево), -1 = нет.
p3_keys=
p4_keys=
; Геймпады игроков 3 и 4: auto — сами (при четырёх геймпадах у игрока 3 третий,
; у игрока 4 четвёртый; если геймпадов меньше, чем игроков, они сначала у игроков
; 3 и 4, а игроки 1 и 2 играют на клавиатуре), 0 — нет, N — N-й геймпад по списку
; игры. Кнопки — как у геймпада игрока 1 в ПАРАМЕТРАХ УПРАВЛЕНИЯ. Геймпад игрока 3
; или 4 игрока 1 или 2 больше не двигает. В игре по сети не действует: там у
; каждого ПК один игрок.
p3_pad=auto
p4_pad=auto
; Story Mode на двоих, выбор персонажа. Если удалённый P2 подключён, он
; выбирает сам. Если нет: через p2_autopick_delay_ms мод выбирает за P2 и отвечает
; «ДА» на «Ты уверен?»
; (если за это время курсор P2 никто не трогал).
p2_autopick=1
p2_autopick_delay_ms=1500
p2_character=auto    ; auto = случайная свободная черепашка; first = первая свободная

[video]
widescreen=1         ; 0 = как в оригинале (только 4:3)
resolution=desktop   ; desktop = разрешение рабочего стола; game = из настроек игры; или 1920x1080
refresh=60           ; желаемая частота, Гц, если игра её предлагает (иначе максимальная); 0 = как у рабочего стола
hud=center           ; center = интерфейс в центре 4:3 без искажений; stretch = растянуть
fullscreen_images=pillarbox ; меню, ролики и картинки на весь экран: pillarbox = 4:3 без искажений; stretch = растянуть
side_bars=blur       ; что по бокам от них: blur = размытое продолжение картинки; black = чёрные полосы
wide_menus=1         ; меню на весь широкий экран: фон главного меню, параметров и выбора уровней
                     ; продолжается до краёв (без полос); 0 = и в меню полосы, как у картинок
fov=100              ; обзор, % от обзора игры: 100 = как в игре; 110..150 = камера видит шире
                     ; (только картинка: игре друга это не мешает)
own_camera=1         ; в игре вместе камера у каждого своя: 1 = этот ПК рисует мир вокруг своей черепахи;
                     ; 0 = одна камера на всех, как в игре (в меню: ПРОЧИЕ ПАРАМЕТРЫ, КАМЕРА ПО СЕТИ)
hud_size=100        ; панели сверху (жизнь, счёт, сердечки), % от их размера в игре: 50..100
antialiasing=4       ; сглаживание краёв (MSAA): 0 = выкл; 2, 4, 8 (в меню: КАЧЕСТВО; в окне с размером
                     ; не как у картинки она растягивается без чёрных полей)
anisotropy=16        ; анизотропная фильтрация текстур: 0 = как в игре; 2, 4, 8, 16 — чётче под углом
hud_corners=1        ; широкий экран с интерфейсом в центре 4:3: панели игроков и радар — по углам экрана
; Режим экрана. borderless = окно без рамок на весь экран (рекомендуется: выглядит
; как полный экран, но Alt+Tab мгновенный, окна Steam и Discord открываются
; поверх, а игра по сети не встаёт); fullscreen = настоящий полный экран (как в
; оригинале, со сменой разрешения; при Alt+Tab игра замирает); windowed = в окне.
; В borderless и windowed Alt+Enter переключает одно в другое.
display=borderless
window_size=         ; windowed: размер картинки в окне, например 1280x720 (пусто = по разрешению, но не больше экрана)
window_resize=1      ; windowed: окно можно растягивать, пропорции сохраняются (лишнее — чёрные поля)
background=pause     ; pause = как в оригинале, игра на паузе, когда окно не активно;
                     ; run = игра идёт и в фоне, со звуком (только borderless и windowed).
                     ; Удобно хосту: можно переключиться в Discord, а второй игрок продолжает играть
vsync=game           ; game = как решит игра; on = вертикальная синхронизация; off = без неё
fps_limit=0          ; ограничение кадров в секунду, 0 = нет (например 60 для монитора 144 Гц)

[audio]
movie_follow=1       ; 1 = ролики (заставка при запуске) звучат как музыка по настройкам игры; 0 = как было: громче всей игры
movie_level=-1       ; или своя громкость роликов 0..4, как ползунки игры (ПАРАМЕТРЫ ЗВУКА → РОЛИКИ); -1 = как музыка
movie_volume=100     ; и ещё тише: % от этого (100 = не убавлять)
intro=play           ; play = показывать заставку; skip = сразу в главное меню

[mouse]
; Кнопки мыши ставятся в игре, как клавиши: ПАРАМЕТРЫ УПРАВЛЕНИЯ → КЛАВИАТУРА,
; «выбрать» действие и щёлкнуть кнопкой мыши — в клетке будет ЛКМ, ПКМ, СКМ, М4
; или М5. Здесь можно ещё добавить кнопку к клавише (в таблице «F +ЛКМ»: работают
; и клавиша, и кнопка). player = чьи кнопки по умолчанию (1, 2; 0 = добавки
; выключены). Кнопка: attack (атака), strong (сильная атака), jump, shuriken,
; shuriken_change, dash, juggle, special, start, pause, move_up, move_down,
; move_left, move_right; «2:attack» = атака игрока 2; пусто = ничего.
player=1
left=
right=
middle=
x1=                  ; боковая кнопка «назад»
x2=                  ; боковая кнопка «вперёд»

[ui]
menu_label=          ; надпись пункта в главном меню игры (пусто = СЕТЕВАЯ ИГРА)
debug_window=0       ; 1 = F2 открывает служебное окно tmntnet поверх игры (настройки — в меню игры)
nametags=1           ; игра вдвоём по сети: имя игрока над его черепахой (0 = не показывать)

[client]
pad=-1               ; номер геймпада (SDL), -1 = первый подключённый
                     ; поддерживаются Xbox, DualShock/DualSense, Switch Pro и др.
keyboard=1           ; 1 = читать клавиатуру (раскладка в [keys])
send_hz=120          ; частота отправки ввода
stick_deadzone=16000 ; порог стика для направлений (из 32767)

; Геймпад: действие = кнопки (A B X Y LB RB LT RT BACK START LS RS DPAD_*).
; Имена по раскладке Xbox, по положению кнопок. У PlayStation: A = крест,
; B = круг, X = квадрат, Y = треугольник, BACK = Share/Create, START = Options.
; Направления всегда идут с крестовины и левого стика.
[pad]
jump=A
attack=X             ; слабая атака / "выбрать" в меню
strong=Y             ; сильная атака / "отмена" в меню
shuriken=B
dash=RB
shuriken_change=LB
special=RT
juggle=LT
start=START
pause=BACK

; Клавиатура клиента: действие = клавиши (буквы, цифры, SPACE, ENTER, UP,
; NUMPAD4, F1, 0x41...). По умолчанию не пересекается с клавишами P1 игры,
; чтобы клиент можно было проверить на том же ПК.
[keys]
up=I
down=K
left=J
right=L
jump=Z
attack=A
strong=X
shuriken=Q
dash=W
special=C
juggle=V
shuriken_change=B
start=T
pause=P
